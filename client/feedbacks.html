<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile Page</title>
    <link rel="stylesheet" href="style/profile.css" />
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>

<body>
    <div id="header"></div>

    <main class="profile-section">
        <section class="left-nav-menu">
            <button class="back-home" id="back-home">
                <iconify-icon icon="line-md:arrow-left" width="34" height="34"></iconify-icon>Back Home
            </button>
        </section>

        <section class="right-side">
        </section>
    </main>

    <div id="footer"></div>

    <script>
      // Dynamically load header and footer html into the divs
      fetch('header.html')
        .then(res => res.text())
        .then(html => document.getElementById('header').innerHTML = html)
        .catch(err => console.error('Error loading header:', err));

      fetch('footer.html')
        .then(res => res.text())
        .then(html => document.getElementById('footer').innerHTML = html)
        .catch(err => console.error('Error loading footer:', err));
    </script>

    <!-- JS Files -->
    <script type="module" src="js/profilepage.js"></script>
    <script type="module" src="js/profile-list-event/list-edit-item.js"></script>
    <script type="module" src="js/profile-list-event/list-view-item.js"></script>
    <script type="module" src="js/profile-bids-event/bids-view-item.js"></script>
</body>

</html>
