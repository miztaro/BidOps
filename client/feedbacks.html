<!DOCTYPE html>
<html lang="en">
<!-- This shows all the userratings for now. update once the login implementation is created! -->

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Feedbacks</title>
    <link rel="stylesheet" href="style/feedbacks.css" />
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="js/client-guard.js"></script>
</head>

<body>
    <div id="header"></div>

    <main class="profile-section">
        <section class="left-nav-menu">
            <button class="back-profile" id="back-profile">
                <iconify-icon icon="line-md:arrow-left" width="34" height="34"></iconify-icon>
                <span>Back to Profile</span>
            </button>
        </section>
        <section class="right-side">
            <div class="title-container">
                <h3>Feedbacks</h3>
                <div class="analytics"></div>
            </div>

            <div id="profile-feedback-content" class="profile-feedback-content">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Rater</th>
                                <th>Rating</th>
                                <th>Comment</th>
                                <th>Completed At</th>
                                <th>Transaction Status</th>
                            </tr>
                        </thead>
                        <tbody id="feedback-tbody">
                            <!-- taken from JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <div id="footer"></div>

    <script>
        fetch('header.html')
            .then(res => res.text())
            .then(html => document.getElementById('header').innerHTML = html)
            .catch(err => console.error('Error loading header:', err));

        fetch('footer.html')
            .then(res => res.text())
            .then(html => document.getElementById('footer').innerHTML = html)
            .catch(err => console.error('Error loading footer:', err));
    </script>

    <!-- JS Files -->
    <script type="module" src="js/feedbacks.js"></script>
    <script type="module" src="js/profilepage.js"></script>
    <script type="module" src="js/profile-list-event/list-edit-item.js"></script>
    <script type="module" src="js/profile-list-event/list-view-item.js"></script>
    <script type="module" src="js/profile-bids-event/bids-view-item.js"></script>
    <script src="js/header.js"></script>
</body>

</html>
