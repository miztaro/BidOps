<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="style/profile.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
    <main class="profile-section">
        <section class="left-nav-menu">
            <button class="back-home" id="back-home"><iconify-icon icon="line-md:arrow-left" width="34" height="34"></iconify-icon>Back Home</button>

            <button id="profile-user-info-btn"  class="user-profile-btn">
                <div class="img-container">
                    <img src="\BidOps\assets\images\lander.jpg" alt="">
                </div>
                <div class="user-info">
                    <h6>Lander Fugeh</h6>
                    <p>2244560</p>
                </div>
                <iconify-icon class="user-profile-arrow" icon="iconamoon:arrow-right-2-light" width="34" height="34"></iconify-icon>
            </button>
            <button id="profile-listings-btn" class="listings-btn">
                <iconify-icon class="listings-logo" icon="material-symbols:list-rounded" width="34" height="34"></iconify-icon>
                <h6>My Listings</h6>
                <p>10 Items</p>
            </button>
            <button id="profile-bids-btn" class="bids-btn">
                <iconify-icon class="bids-logo" icon="material-symbols:bid-landscape-rounded" width="34" height="34"></iconify-icon>
                <h6>My Winning Bids</h6>
                <p>10 Items</p>
            </button>
            <button id="profile-swaps-btn" class="swaps-btn">
                <iconify-icon class="swaps-logo" icon="ph:swap-bold" width="34" height="34"></iconify-icon>
                <h6>My Swapped Items</h6>
                <p>10 Items</p>
            </button>
        </section>

        <section class="right-side">
            <div class="title-container">
                <h3>My Listings</h3>
                <div class="analytics"></div>
            </div>

            <div id="profile-user-info-content" class="profile-user-info-content">TODO</div>

            <div id="profile-listings-content" class="listings-content">
                <table>
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Category</th>
                            <th>Mode</th>
                            <th>Date Listed</th>
                            <th>Status</th>
                            <th><iconify-icon icon="flowbite:filter-outline" width="24" height="24"></iconify-icon></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="body-row"></tr>
                    </tbody>
                </table>
            </div>

            <div id="profile-bids-content" class="profile-bids-content">
                <table>
                    <thead>
                        <tr>
                            <th>item</th>
                            <th>Category</th>
                            <th>Winning Bid</th>
                            <th>Date Won</th>
                            <th><iconify-icon icon="flowbite:filter-outline" width="24" height="24"></iconify-icon></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="body-row"></tr>
                    </tbody>
                </table>
            </div>
            <div id="profile-swaps-content" class="profile-swaps-conent">
                <table>
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Category</th>
                            <th>Swapped Item</th>
                            <th>Date Swapped</th>
                            <th><iconify-icon icon="flowbite:filter-outline" width="24" height="24"></iconify-icon></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="body-row"></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="js/profilepage.js"></script>
</body>
</html>
