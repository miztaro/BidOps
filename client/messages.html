<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>
    <link rel="stylesheet" href="style/messages.css"> 
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="js/client-guard.js"></script>
</head>
<body>
    <div id="header"></div>

    <main class="messages-container">

        <div class="chat-list">
            <div class="search-box">
                <input type="text" placeholder="Search Message">
            </div>
            
            <div id="chatListContainer">
                <p style="text-align: center; padding: 10px;">Loading chats...</p>
            </div>
            
        </div>

        <div class="chat-window">
            
            <div class="chat-window-header" id="chatWindowHeader">
                <p style="text-align: center; padding-top: 20px;">Select a chat to begin.</p>
            </div>
            
            <div class="messages-content" id="messagesContent">
            </div>

            <div class="chat-input-wrapper">
                
                <div id="imagePreview" class="image-preview"></div>

                <div class="chat-input-bar">
                    <button class="icon-btn attach-btn">
                        <iconify-icon icon="heroicons-solid:photograph" width="24" height="24"></iconify-icon>
                        <input type="file" id="uploadInput" accept="image/*" hidden>
                    </button>
                    
                    <div class="input-box">
                        <input type="text" id="messageInput" placeholder="Aa" autocomplete="off">
                    </div>
                    <input type="hidden" id="currentChatId">

                    <button class="icon-btn send-btn" id="sendMessageBtn">
                        <iconify-icon icon="ion:paper-plane" width="24" height="24"></iconify-icon>
                    </button>
                </div>
            </div>
        </div>


    </main>
    <script src="js/add-listing.js" defer></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/header.js"></script>
</body>
</html>
