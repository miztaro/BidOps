<link rel="stylesheet" href="../client/style/header.css">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<header class="main-header">
  <!-- LEFT: logo image -->
  <div class="header-left">
    <img src="../assets/images/HeaderLogo.png" alt="SLU Swap and Bid" class="slu-header-img">
  </div>

  <!-- RIGHT: icons (top) + search + add button (bottom) -->
  <div class="header-right">
    <div class="header-icons">
      <iconify-icon icon="material-symbols:notifications-outline" width="28" height="28"></iconify-icon>
      <iconify-icon icon="ri:message-3-line" width="25" height="25"></iconify-icon>
      <iconify-icon id="user-header-profile-icon" icon="gg:profile" width="38" height="38"></iconify-icon>
    </div>

    <div class="header-bottom">
      <div class="header-search">
        <input type="text" placeholder="Search items, books, equipment..." />
        <button>
          <iconify-icon icon="mdi:magnify" width="22"></iconify-icon>
        </button>
      </div>

      <button class="add-btn">
        Add Listing <span>+</span>
      </button>
    </div>
  </div>
</header>
