<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Listing</title>
    <link rel="stylesheet" href="../client/style/add-listing.css">
</head>
<body>
    <div class="container">
        <h2>Create a Listing</h2>
        <div id="message"></div>
        <form id="listingForm" enctype="multipart/form-data">
            <label for="title">Item Title</label>
            <input type="text" id="title" name="title" placeholder="Enter item title" required>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select Category</option>
                <option value="Electronics">Electronics</option>
                <option value="General Education">General Education</option>
                <option value="Architecture">Architecture</option>
                <option value="Business Economics">Business Economics</option>
                <option value="Engineering & CS">Engineering & CS</option>
                <option value="Natural Science">Natural Science</option>
                <option value="Social Science">Social Science</option>
                <option value="Health & Medicine">Health & Medicine</option>
                <option value="Education & Teaching">Education & Teaching</option>
                <option value="Law">Law</option>
                <option value="Media & Communications">Media & Communications</option>
                <option value="Arts & Humanities">Arts & Humanities</option>
                <option value="Non-Academic">Non-Academic</option>
                <option value="Sports">Sports</option>
                <option value="Collectibles">Collectibles</option>
                <option value="Accessories">Accessories</option>
                <option value="Gaming">Gaming</option>
                <option value="Home">Home</option>
                <option value="Photography">Photography</option>
                <option value="Toys">Toys</option>
                <option value="Fashion">Fashion</option>
            </select>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Enter item description" required></textarea>

            <label for="image">Upload Image</label>
            <input type="file" id="image" name="image" accept="image/*" required>

            <label for="listingType">Listing Type</label>
            <select id="listingType" name="listingType" required>
                <option value="swap">Swap</option>
                <option value="bid">Bidding</option>
            </select>

            <div id="bidFields" style="display: none;">
                <label for="starting_price">Starting Price (₱)</label>
                <input type="number" id="starting_price" name="starting_price" step="0.01" min="0" placeholder="0.00">
            </div>

            <div class="buttons">
                <button type="submit" class="create-btn">Create Listing</button>
                <button type="button" class="cancel-btn" onclick="window.location.href='homepage.html'">Cancel</button>
            </div>
        </form>
    </div>

    <script>
        
        document.getElementById('listingType').addEventListener('change', function() {
            const bidFields = document.getElementById('bidFields');
            if (this.value === 'bid') {
                bidFields.style.display = 'block';
                document.getElementById('starting_price').required = true;
            } else {
                bidFields.style.display = 'none';
                document.getElementById('starting_price').required = false;
            }
        });

        // handle form submission with AJAX(?)
        document.getElementById('listingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            const submitBtn = document.querySelector('.create-btn');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            fetch('http://localhost:8000/server_try/item/insert_item.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                showMessage(data.message, data.message.includes('successfully') ? 'success' : 'error');
                
                if (data.message.includes('successfully')) {
                    setTimeout(() => {
                        window.location.href = 'homepage.html';
                    }, 2000);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('Error creating listing: ' + error.message, 'error');
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            });
        });

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
            
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.innerHTML = '';
                }, 3000);
            }
        }
    </script>
</body>
</html>
