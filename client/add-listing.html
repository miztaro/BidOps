<!-- add-listing-modal.html -->
<style>
    /* === POPUP CSS STYLES === */
    
    /* 1. The Overlay - Forces it to cover the screen */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6); /* Dark see-through background */
        z-index: 9999; /* Higher than header */
        display: none; /* Hidden by default */
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
        backdrop-filter: blur(3px);
    }

    /* 2. The White Box */
    .modal-container {
        background: white;
        width: 100%;
        max-width: 650px;
        max-height: 90vh; /* Don't go taller than screen */
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: slideIn 0.3s ease-out;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    @keyframes slideIn {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* 3. Header */
    .modal-header {
        padding: 15px 20px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8f9fa;
    }
    .modal-header h2 { margin: 0; font-size: 1.25rem; color: #333; }
    .modal-close {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: #666;
    }
    .modal-close:hover { color: #d32f2f; }

    /* 4. Body & Form */
    .modal-body {
        padding: 20px;
        overflow-y: auto; /* Scrollable if too tall */
    }

    /* Layout Helpers */
    .row { display: flex; gap: 15px; margin-bottom: 15px; }
    .col { flex: 1; display: flex; flex-direction: column; }
    .full { width: 100%; }
    
    /* Inputs */
    label { font-size: 0.9rem; font-weight: 600; margin-bottom: 5px; color: #444; }
    input, select, textarea {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 0.95rem;
        width: 100%;
        box-sizing: border-box;
    }
    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #004aad;
        box-shadow: 0 0 0 3px rgba(0,74,173,0.1);
    }

    /* Listing Type Selector */
    .listing-type-row {
        padding: 10px 20px;
        background: #eef2f6;
        border-bottom: 1px solid #ddd;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* Image Upload Area */
    .image-upload-area {
        border: 2px dashed #ccc;
        padding: 20px;
        text-align: center;
        border-radius: 8px;
        cursor: pointer;
        background: #fafafa;
        transition: 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .image-upload-area:hover { border-color: #004aad; background: #f0f7ff; }
    
    .image-preview {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 10px;
        width: 100%;
        justify-content: center;
    }
    .preview-img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid #ddd;
    }

    /* Buttons */
    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid #eee;
    }
    .cancel-btn {
        padding: 10px 20px;
        background: #f1f3f5;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
    }
    .create-btn {
        padding: 10px 20px;
        background: #004aad; /* SLU Blue */
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
    }
    .create-btn:hover { background: #003380; }

    /* Mobile adjustments */
    @media (max-width: 600px) {
        .row { flex-direction: column; gap: 10px; }
        .modal-container { height: 100%; max-height: 100%; border-radius: 0; }
    }
</style>

<div class="modal-overlay" id="addListingModal">
    <div class="modal-container">
        <div class="modal-header">
            <h2>Add Listing</h2>
            <button class="modal-close" id="modalClose">&times;</button>
        </div>

        <div class="listing-type-row">
            <label for="listingTypeSelect" class="listing-type-label" style="margin:0;">Listing Type:</label>
            <select id="listingTypeSelect" class="listing-type-select" style="width: auto;">
                <option value="bid">Bid</option>
                <option value="swap">Swap</option>
            </select>
            <input type="hidden" id="listingType" name="listingType" value="bid">
        </div>

        <div class="modal-body">
            <form id="modalListingForm" enctype="multipart/form-data">
                <div id="modalMessage"></div>

                <div class="form-container">
                    <div class="row">
                        <div class="col">
                            <label for="title">Item Title*</label>
                            <input type="text" id="title" name="title" placeholder="e.g. Calculus Textbook" maxlength="50" required>
                            <div style="text-align: right; font-size: 12px; color: #888;"><span id="titleCount">0</span>/50</div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col">
                            <label for="category">Category*</label>
                            <select id="category" name="category" required>
                                <option value="">Select Category</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Sports">Sports</option>
                                <option value="Books">Books</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Fashion">Fashion</option>
                                <option value="Gaming">Gaming</option>
                                <option value="Home">Home</option>
                                <option value="Toys">Toys</option>
                            </select>
                        </div>
                    </div>

                    <div class="row full">
                        <div class="col">
                            <label for="description">Description*</label>
                            <textarea id="description" name="description" rows="4" placeholder="Describe the condition, reason for selling, etc." required></textarea>
                        </div>
                    </div>

                    <!-- Bid Specific Fields -->
                    <div id="bidFields">
                        <div class="row">
                            <div class="col">
                                <label>Starting Price (₱)</label>
                                <input type="number" id="starting_price" name="starting_price" placeholder="0.00" step="0.01">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <label>Start Date</label>
                                <input type="datetime-local" id="start_date" name="start_date">
                            </div>
                            <div class="col">
                                <label>End Date</label>
                                <input type="datetime-local" id="end_date" name="end_date">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col">
                                <label>Bid Increment: <span id="incrementValue">5%</span></label>
                                <input type="range" id="bidIncrement" min="1" max="20" value="5" style="width: 100%;">
                            </div>
                        </div>
                    </div>

                    <div class="row full" style="margin-top: 15px;">
                        <div class="col">
                            <label>Item Images</label>
                            <div class="image-upload-area" id="imageUploadArea">
                                <div id="imagePreview" class="image-preview"></div>
                                <iconify-icon icon="bi:image" width="30" height="30" style="color:#ccc;"></iconify-icon>
                                <p style="margin: 5px 0; font-size: 0.9rem; color: #666;">Click to upload images</p>
                                <input type="file" id="image" name="image" multiple hidden accept="image/*">
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="cancel-btn" id="modalCancelBtn">Cancel</button>
                        <button type="submit" class="create-btn">Create Listing</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
