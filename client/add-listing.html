<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Item</title>
    <link rel="stylesheet" href="../client/style/add-listing.css">
</head>
<body>
    
    <div class="container">
        <h2>List Item</h2>
        <div id="message"></div>
        <form id="listingForm" enctype="multipart/form-data">
            <label for="title">Item Title</label>
            <input type="text" id="title" name="title" placeholder="Enter item title" required>
            
            <label for="listingType">Listing Type</label>
            <select id="listingType" name="listingType" required>
                <option value="">Select Item type</option>
                <option value="swap">Swap</option>
                <option value="bid">Bidding</option>
            </select>
            
            <div id="bidFields" style="display: none;">
                <label for="starting_price">Starting Price (₱)</label>
                <input type="number" id="starting_price" name="starting_price" step="0.01" min="0" placeholder="Enter starting price">
                
                <label for="end_date">Bid End Date & Time</label>
                <input type="datetime-local" id="end_date" name="end_date">
                <small class="date-note">Bid must end at least 1 hour from now</small>
            </div>

            <div class="form-section-spacing"></div>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select category</option>
                <option value="Electronics">Electronics</option>
                <option value="Sports">Sports</option>
                <option value="Collectibles">Collectibles</option>
                <option value="Accessories">Accessories</option>
                <option value="Fashion">Fashion</option>
                <option value="Gaming">Gaming</option>
                <option value="Home">Home</option>
                <option value="Photography">Photography</option>
                <option value="Toys">Toys</option>
            </select>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Enter item description" required></textarea>

            <label for="image">Upload Image</label>
            <input type="file" id="image" name="image" accept="image/*" required>

            <div class="buttons">
                <button type="submit" class="create-btn">Post Item</button>
                <button type="button" class="cancel-btn" onclick="window.location.href='homepage.html'">Cancel</button>
            </div>
        </form>
    </div>
    <script src="../client/js/add-listing.js"></script>
</body>
</html>
