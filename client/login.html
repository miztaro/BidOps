  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="../client/style/login.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script> <!-- google login -->
    <script src="../client/js/login.js"></script>
  </head>
  <body>

    <!-- TOP: SLU logo centered -->
    <header class="top-logo">
      <!-- SLU logo -->
      <img src="../assets/images/LoginHeader.png" alt="Saint Louis University Logo">
    </header>

    <!-- MAIN: card wrapper -->
    <main class="stage">
      <div class="card">
        <!-- Left: login card (overlapping) -->
        <section class="left-card">
          <h2 class="left-title">Log In</h2>

          <label for="username" class="lbl">Username</label>
          <input id="username" class="input" type="text" placeholder="">

          <label for="password" class="lbl">Password</label>
          <input id="password" class="input" type="password" placeholder="">

          <button class="btn primary">Login</button>

          <div class="divider">
            <span class="line"></span>
            <span class="or">or</span>
            <span class="line"></span>
          </div>

        <div id="google-button-container" class="google-btn-wrapper"></div>

          <p class="signup">Don't have an account? <a href="register.html">Sign up</a></p>
        </section>

        <!-- Right: blue info panel -->
        <aside class="right-panel">
          <div class="welcome">
            <h3>Welcome to Your Campus Marketplace</h3>
            <p>A secure platform exclusively for SLU faculty members to swap and bid items within our academic community.</p>
            <div class="features">
              <div class="feature-item">
                <iconify-icon icon="icon-park-solid:transaction" width="16" height="16"></iconify-icon>
                Secure faculty-only access
              </div>

            <div class="feature-item">
                <iconify-icon icon="material-symbols:shield" width="16" height="16"></iconify-icon>
                Easy item swapping & bidding
            </div>
            <div class="feature-item">
                <iconify-icon icon="fa7-solid:user-friends" width="16" height="16"></iconify-icon>
                Connect with colleagues
            </div>
          </div>
          </div>
        </aside>
      </div>
    </main>

  </body>
  </html>
