<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Reports | Swap and Bid</title>
  <link rel="stylesheet" href="styles/manage-reports.css" />
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script src="js/admin-guard.js"></script>
</head>
<body>
  <div id="header"></div>
  
  <main class="content">
    <section class="heading">
      <h1>User Reports Management</h1>
      <p class="subtext">Review and manage user-submitted reports</p>
    </section>

    <!-- Filter Section -->
    <section class="filter-section">
      <div class="filter-group">
        <label>User Reports</label>
        
      </div>
      
      <div class="filter-group">
        <label>Date Submitted:</label>
        <input type="date" id="filter-date">
      </div>
      
      <div class="filter-group">
        <label>Filter Time:</label>
        <select id="filter-sort">
          <option value="all">All time</option>
          <option value="today">Today</option>
          <option value="week">Last 7 days</option>
          <option value="month">Last 30 days</option>
        </select>
      </div>
      
      <button id="apply-filters" class="primary-btn">Apply Filters</button>
    </section>

    <!-- Reports Table -->
    <section class="reports-table-container">
      <table class="reports-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Target</th>
            <th>Reporter Email</th>
            <th>Reason</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="reports-table-body">
          <!-- JS injects rows here -->
        </tbody>
      </table>
    </section>

    <!-- Empty State -->
    <section id="empty-state" class="hidden" style="text-align:center; padding: 2rem; color: #666;">
      <iconify-icon icon="mdi:clipboard-check-outline" width="48"></iconify-icon>
      <p>No pending reports found.</p>
    </section>

    <div class="pagination">
      <p id="pagination-info">Loading...</p>
    </div>
  </main>

  <!-- Report Details Modal -->
  <div id="report-modal" class="modal hidden">
    <div class="modal-content">
      <span class="modal-close" id="modal-close">&times;</span>
      <h2>Report Details</h2>
      <div class="modal-body">
        <div class="detail-row">
          <span class="label">Report ID:</span>
          <span class="value" id="modal-report-id"></span>
        </div>
        <div class="detail-row">
          <span class="label">Type:</span>
          <span class="value" id="modal-report-type"></span>
        </div>
        <div class="detail-row">
          <span class="label">Target:</span>
          <span class="value" id="modal-reported-target"></span>
        </div>
        <div class="detail-row">
          <span class="label">Reporter:</span>
          <span class="value" id="modal-reporter"></span>
        </div>
        <div class="detail-row">
          <span class="label">Date:</span>
          <span class="value" id="modal-date"></span>
        </div>
        <div class="detail-row full-width">
          <span class="label">Reason / Description:</span>
          <div class="description-box" id="modal-description"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-view-item" id="modal-view-item">View Target</button>
        <div class="right-actions">
            <button class="btn-dismiss" id="modal-dismiss">Dismiss</button>
            <button class="btn-ban" id="modal-ban">Ban Target</button>
        </div>
      </div>
    </div>
  </div>
  <!-- USER PROFILE POPUP MODAL -->
  <div id="user-profile-view-modal" class="user-view-overlay" style="display: none;">
      <div class="user-view-content">
          <button id="close-user-view" class="user-view-close">&times;</button>
        
          <div class="user-view-header">
            <!-- The Avatar Image -->
             <img id="view-user-avatar" class="user-view-avatar" alt="User Avatar">
            
              <h2 id="view-user-name">Loading...</h2>
              <p class="user-view-id">ID: <span id="view-user-id">--</span></p>
              <p class="user-view-email"><iconify-icon icon="mdi:email-outline"></iconify-icon> <span id="view-user-email">--</span></p>
          </div>

          <div class="user-view-body">
              <!-- Additional User Stats or Info can go here -->
              <div class="user-stat-box">
                  <p>Status</p>
                  <h4 id="view-user-status" class="status-active">Active</h4>
             </div>
          </div>

          <div class="user-view-actions">
            <!-- Report Button (Visible only for Clients) -->
              <button id="btn-report-user" class="btn-report-action" style="display: none;">
                  <iconify-icon icon="mdi:alert-octagon"></iconify-icon> Report User
              </button>
            
              <!-- Close Button -->
              <button id="btn-close-user-view" class="btn-secondary-action">Close</button>
         </div>
      </div>
  </div>
  <script src="js/manage-reports.js"></script>
  <script src="js/view-user-profile.js"></script>
</body>
</html>
