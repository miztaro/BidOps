<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Reports | Swap and Bid</title>
  <link rel="stylesheet" href="styles/manage-reports.css" />
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script src="js/admin-guard.js"></script>
</head>
<body>
  <div id="header"></div>
  
  <main class="content">
    <section class="heading">
      <h1>User Reports Management</h1>
      <p class="subtext">Review and manage user-submitted reports</p>
    </section>

    <section class="filter-section">
      <div class="filter-group">
        <label>Report Type:</label>
        <select id="filter-type">
          <option value="all">All Types</option>
          <option value="item">Item Report</option>
          <option value="user">User Report</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label>Date Submitted:</label>
        <input type="date" id="filter-date">
      </div>
      
      <div class="filter-group">
        <label>Sort by:</label>
        <select id="filter-sort">
          <option value="all">All time</option>
          <option value="today">Today</option>
          <option value="week">Last 7 days</option>
          <option value="month">Last 30 days</option>
        </select>
      </div>
      
      <button id="apply-filters">Apply Filters</button>
    </section>

    <section class="reports-table-container">
      <table class="reports-table">
        <thead>
          <tr>
            <th>Report ID</th>
            <th>Report Target</th>
            <th>Reporter</th>
            <th>Description</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="reports-table-body">
          <!-- Reports inserted here -->
        </tbody>
      </table>
    </section>

    <section id="empty-state" class="hidden">
      <p>No reports found.</p>
    </section>

    <div class="pagination">
      <p id="pagination-info">Showing 0 reports</p>
    </div>
  </main>

  <!-- Report Details Modal -->
  <div id="report-modal" class="modal hidden">
    <div class="modal-content">
      <span class="modal-close" id="modal-close">&times;</span>
      <h2>Report Details</h2>
      <div class="modal-body">
        <div class="detail-row">
          <span class="label">Report ID:</span>
          <span class="value" id="modal-report-id"></span>
        </div>
        <div class="detail-row">
          <span class="label">Type:</span>
          <span class="value" id="modal-report-type"></span>
        </div>
        <div class="detail-row">
          <span class="label">Target:</span>
          <span class="value" id="modal-reported-target"></span>
        </div>
        <div class="detail-row">
          <span class="label">Reporter:</span>
          <span class="value" id="modal-reporter"></span>
        </div>
        <div class="detail-row">
          <span class="label">Date:</span>
          <span class="value" id="modal-date"></span>
        </div>
        <div class="detail-row full-width">
          <span class="label">Description:</span>
          <p class="description-text" id="modal-description"></p>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-view-item" id="modal-view-item">View Target</button>
        <button class="btn-ban" id="modal-ban">Ban Target</button>
        <button class="btn-dismiss" id="modal-dismiss">Dismiss</button>
      </div>
    </div>
  </div>

  <script src="js/manage-reports.js"></script>
</body>
</html>
