<link rel="stylesheet" href="/styles/header.css">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<header class="admin-header">
  <!-- LEFT: logo -->
  <div class="header-left">
    <img src="/assets/images/HeaderLogo.png" alt="SLU Swap and Bid" class="slu-header-img">
  </div>

  <!-- RIGHT -->
  <div class="header-right">
    <!-- Admin links row -->
    <div class="admin-links">
      <a href="manage-listing.html" class="admin-link">Review Listings</a>
      <a href="manage-reports.html" class="admin-link">Manage Reports</a>
      <iconify-icon icon="gg:profile" width="38" height="38"></iconify-icon>
    </div>

    <!-- Search + button -->
    <div class="header-bottom">
      <div class="header-search">
        <input type="text" placeholder="Search items, books, equipment..." />
        <button>
          <iconify-icon icon="mdi:magnify" width="22"></iconify-icon>
        </button>
      </div>
    </div>
  </div>
</header>
