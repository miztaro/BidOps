<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Listings | Swap and Bid</title>
  <link rel="stylesheet" href="styles/manage-listing.css" />
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <script src="js/admin-guard.js"></script>
</head>
<body>
  <div id="header"></div>
    <main class="content">
    <section class="heading">
      <h1>Pending Listings for Review</h1>
      <p class="subtext">Review and manage submitted listings before they go live</p>
    </section>

    <section class="filter-section">
      <div class="filter-group">
        <label>Category:</label>
        <select id="filter-category">
          <option value="all">All categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Books">Books</option>
          <option value="Furniture">Furniture</option>
          <option value="Clothing">Clothing</option>
          <option value="Sports">Sports</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label>Submission Date:</label>
        <input type="date" id="filter-date">
      </div>
      
      <div class="filter-group">
        <label>Sort by:</label>
        <select id="filter-sort">
          <option value="all">All time</option>
          <option value="today">Today</option>
          <option value="week">Last 7 days</option>
          <option value="month">Last 30 days</option>
        </select>
      </div>
      
      <button id="apply-filters">Apply Filters</button>
    </section>

    <section class="listing" id="listing-container">
        <!-- Listings will be loaded here by JS -->
    </section>
      
    <section id="empty-state" class="hidden">
      <p>No pending listings found.</p>
    </section>
  </main>

  <!-- Scripts -->
  <script src="js/manage-listing.js"></script>
</body>
</html>
